services:
  node:
    container_name: ${DOCKER_PROJECT_NAME}_node
    # dashboard-uzswlu node:18-alpine3.18'dan farqli — bu loyiha Vite 8 +
    # TypeScript 6 ishlatadi, ular Node >=20.19 (yaxshisi >=22.12) talab
    # qiladi (node_modules/vite/package.json "engines"). 18 bilan build
    # muvaffaqiyatsiz tugaydi.
    image: node:22-alpine
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    # `npm ci` — package-lock.json bo'yicha aynan o'rnatadi va uni qayta
    # yozmaydi; `npm install` uni o'zgartirib, keyingi `git pull`ni to'sardi.
    command: /bin/sh -c "npm ci && npm run build"
